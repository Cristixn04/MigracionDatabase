spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/librarydb
    username: postgres
    password: colombia2020
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: librarydb_schema
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    schemas:
      - librarydb_schema
    default-schema: librarydb_schema
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8082
